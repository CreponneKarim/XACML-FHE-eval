[package]
name = "hpdp_funcs"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
affinity = "0.1.2"
anyhow = "1.0.100"
chrono = "0.4.42"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
crossbeam-deque = "0.8.6"
csv = "1.4.0"
itertools = "0.14.0"
natord = "1.0.9"
num = "0.4.3"
quick-xml = { version = "0.38.3", features = ["serde", "serde-types", "serialize"] }
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.149"
tfhe = {workspace = true}
types = { version = "0.1.0", path = "../hpdp_types/types" }
walkdir = "2.5.0"
xsd-parser = { git="https://github.com/Bergmann89/xsd-parser", rev="a848753", features = ["reqwest", "web-resolver", "update-expectations","num"] }
bincode = "1.3.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread"] }
config-file = "0.2.3"
base64 = "0.22.1"
clap = { workspace = true, features = ["derive"] }
proc-macro2 = "1.0.106"
shared = { version = "0.1.0", path = "../shared" }
actix-web = "4.13.0"
rkyv = {workspace=true}
redis = "1.2.0"
rand.workspace = true
uuid = { workspace = true }